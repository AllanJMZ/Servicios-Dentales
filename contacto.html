<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contacto.css">
    <link rel="stylesheet" href="css/font/flaticon.css">
    <link rel="stylesheet" href="css/icon/icofont.min.css">
    <title>Consultorio Dental - Contacto</title>
    <script type="module" src="js/main.js"></script>
</head>

<body data-page="contacto">
    <header id="site-header"></header>

    <main class="contenedor">
        <h1 class="fw-400 centrar-texto">Contacto</h1>

        <div class="form-container">
            <form id="contact-form" class="contact-form" novalidate>
                <h2>Formulario de contacto</h2>
                <p class="contact-intro">Por favor, completa los siguientes campos para ponerte en contacto con nosotros:</p>

                <div id="preselected-service-note" class="preselected-service-note" role="status"></div>

                <div class="form-field">
                    <label for="servicio">Servicio de interés:</label>
                    <select id="servicio" name="servicio">
                        <option value="consulta-general">Consulta general</option>
                    </select>
                    <span id="error-servicio" class="field-error" aria-live="polite"></span>
                </div>

                <div class="form-field">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    <span id="error-nombre" class="field-error" aria-live="polite"></span>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="apellido-paterno">Apellido Paterno:</label>
                        <input type="text" id="apellido-paterno" name="apellido-paterno" placeholder="Apellido paterno" required>
                        <span id="error-apellido-paterno" class="field-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <label for="apellido-materno">Apellido Materno:</label>
                        <input type="text" id="apellido-materno" name="apellido-materno" placeholder="Apellido materno" required>
                        <span id="error-apellido-materno" class="field-error" aria-live="polite"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                        <span id="error-correo" class="field-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" required>
                        <span id="error-telefono" class="field-error" aria-live="polite"></span>
                    </div>
                </div>

                <div class="form-field">
                    <label for="comentario">Comentario:</label>
                    <textarea id="comentario" name="comentario" placeholder="Cuéntanos en qué podemos ayudarte..."></textarea>
                    <span id="error-comentario" class="field-error" aria-live="polite"></span>
                </div>

                <div id="form-feedback" class="form-feedback" role="status" aria-live="polite"></div>

                <button type="submit" class="boton">Enviar</button>
            </form>
        </div>
    </main>

    <footer id="site-footer"></footer>
</body>

</html>
