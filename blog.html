<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/font/flaticon.css">
    <link rel="stylesheet" href="css/icon/icofont.min.css">
    <title>Consultorio Dental - Blog</title>
    <script type="module" src="js/main.js"></script>
</head>

<body data-page="blog">
    <header id="site-header"></header>

    <main class="contenedor seccion contenido-centrado">
        <h1 class="fw-400 centrar-texto">Nuestro Blog</h1>

        <section class="toolbar-filters" aria-label="Filtrar artículos del blog">
            <div class="search-box">
                <input
                    type="search"
                    id="blog-search"
                    aria-label="Buscar artículo en el blog"
                    placeholder="Buscar en el blog..."
                    autocomplete="off"
                >
            </div>

            <div id="blog-categories" class="filter-chips" role="group" aria-label="Categorías del blog"></div>
        </section>

        <section id="blog-posts" class="entrada-blog" aria-live="polite"></section>

        <dialog id="blog-modal" class="blog-modal" aria-labelledby="blog-modal-title">
            <div class="blog-modal-header">
                <div>
                    <h2 id="blog-modal-title"></h2>
                    <p id="blog-modal-meta" class="blog-modal-meta"></p>
                </div>
                <button
                    type="button"
                    id="blog-modal-close"
                    class="blog-modal-close"
                    aria-label="Cerrar artículo"
                >
                    &times;
                </button>
            </div>
            <div class="blog-modal-content">
                <img id="blog-modal-image" src="" alt="">
                <div id="blog-modal-body" class="blog-modal-body"></div>
            </div>
        </dialog>
    </main>

    <footer id="site-footer"></footer>
</body>

</html>
