<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/Servicios.css">
    <link rel="stylesheet" href="css/font/flaticon.css">
    <link rel="stylesheet" href="css/icon/icofont.min.css">
    <title>Consultorio Dental - Servicios</title>
    <script type="module" src="js/main.js"></script>
</head>

<body data-page="servicios">
    <header id="site-header"></header>

    <main class="contenedor">
        <h1 class="fw-400 centrar-texto">Nuestros Servicios</h1>

        <section class="toolbar-filters" aria-label="Filtrar tratamientos">
            <div class="search-box">
                <input
                    type="search"
                    id="services-search"
                    aria-label="Buscar tratamiento"
                    placeholder="Buscar tratamiento (ej. blanqueamiento, caries...)"
                    autocomplete="off"
                >
            </div>

            <div id="services-categories" class="filter-chips" role="group" aria-label="Categorías de servicios"></div>
        </section>

        <p id="services-count" class="results-count" aria-live="polite"></p>

        <section id="services-catalog" aria-live="polite"></section>
    </main>

    <footer id="site-footer"></footer>
</body>

</html>
